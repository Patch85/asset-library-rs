[package]
name = "asset-library-desktop"
version = "0.1.0"
description = "Asset Library desktop app"
edition.workspace = true
license.workspace = true

[[bin]]
name = "asset-library-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
asset-library = { version = "0.1.0", path = "../asset-library" }
drag = "2.1.1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[build-dependencies]
tauri-build = "2.7.4"
