[package]
name = "asset-library"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
fast_image_resize = { version = "6.1.0", features = ["image"] }
fastembed = { version = "7.5.0", default-features = false, features = ["image-models", "ort-load-dynamic", "hf-hub-rustls-tls"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5.4.5"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
webp = "0.3.1"
zip = { version = "9.1.3", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Power", "Win32_Foundation"] }
